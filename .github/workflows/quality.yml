name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, Drizzle and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository for committed secrets
        run: npm run security:check

      - name: Type-check
        run: npm run lint

      - name: Validate Drizzle migrations
        run: npm run db:check

      - name: Build production application
        run: npm run build
