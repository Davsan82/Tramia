name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        run: npm run version:check -- "$GITHUB_REF_NAME"

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package build
        env:
          TAG: ${{ github.ref_name }}
        run: tar -czf "tramia-${TAG}.tar.gz" dist README.md database/migrations

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          "tramia-${TAG}.tar.gz"
          --verify-tag
          --generate-notes
          --title "TramIA ${TAG}"
